name: Phone web app
# Runs after each successful Windows build, so the site always carries the newest PrepRep.exe itself
# (people download from the website, never from GitHub's release page).
on:
  workflow_run:
    workflows: ["Build PrepRep"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: web, cancel-in-progress: true }
jobs:
  web:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Photos
        run: python tools/fetch_photos.py
      - name: Build the web app
        run: python tools/build_web.py ${GITHUB_SHA::8}
      - name: Put the newest Windows app on the site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo "${{ github.repository }}" --pattern PrepRep.exe --dir _site/download --clobber
          test "$(stat -c%s _site/download/PrepRep.exe)" -gt 10000000
      - name: Publish to the gh-pages branch (GitHub Pages serves it)
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "PrepRep build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Web app ${GITHUB_SHA::8}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
