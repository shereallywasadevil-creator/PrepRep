<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrepRep</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="appbar">
  <button class="iconbtn" id="back" aria-label="Back" hidden><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="logo"><span class="logo-face" aria-hidden="true"><svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="mbh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef1ea"/></linearGradient></defs>
    <ellipse cx="60" cy="110" rx="34" ry="5" fill="#000" opacity=".08"/>
    <path d="M60 28c-4-10-14-14-22-12 2 9 10 14 22 12z" fill="#7bc96f"/><path d="M60 28c4-12 15-16 24-13-3 10-12 15-24 13z" fill="#56b13f"/><rect x="58" y="24" width="4" height="12" rx="2" fill="#3f8f2c"/>
    <rect x="20" y="36" width="80" height="66" rx="22" fill="url(#mbh)" stroke="#e3e7df" stroke-width="2"/>
    <rect x="20" y="36" width="80" height="16" rx="8" fill="#56b13f"/>
    <circle cx="46" cy="70" r="5" fill="#1c1f1d"/><circle cx="74" cy="70" r="5" fill="#1c1f1d"/><circle cx="47.5" cy="68.5" r="1.6" fill="#fff"/><circle cx="75.5" cy="68.5" r="1.6" fill="#fff"/>
    <path d="M51 80q9 8 18 0" fill="none" stroke="#1c1f1d" stroke-width="3" stroke-linecap="round"/>
    <circle cx="38" cy="80" r="4" fill="#ffb4a2" opacity=".7"/><circle cx="82" cy="80" r="4" fill="#ffb4a2" opacity=".7"/></svg></span>preprep</div>
  <div class="kcal" id="kcalchip" hidden><b id="kcal">…</b> kcal today</div>
  <button class="iconbtn" id="search-btn" aria-label="Search recipes"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
</header>
<main id="main" tabindex="-1"></main>
<div class="buildbar" id="buildbar" hidden><div class="thumbs" id="thumbs"></div><button class="build" id="build">Build plan</button></div>
<nav class="tabs" aria-label="Main">
  <button data-tab="plans"><svg viewBox="0 0 24 24"><path d="M7 3v8M5 3v4a2 2 0 0 0 4 0V3M7 11v10M16 3c-2 1-3 4-3 7h3v11"/></svg><span>Meal Plans</span></button>
  <button data-tab="list"><svg viewBox="0 0 24 24"><path d="M3 4h2l2 11h11l2-8H6"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg><span>List</span><i class="dot" id="list-dot" hidden></i></button>
  <button data-tab="train"><svg viewBox="0 0 24 24"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg><span>Workouts</span></button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M4 18l5-5 4 4 7-8"/></svg><span>Progress</span></button>
  <button data-tab="you"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><span>You</span></button>
</nav>
<script src="bridge.js"></script>
<script src="toast.js"></script>
<script src="states.js"></script>
<script src="form.js"></script>
<script src="store.js"></script>
<script src="chart.js"></script>
<script src="wizard.js"></script>
<script src="app.js"></script>
</body>
</html>
