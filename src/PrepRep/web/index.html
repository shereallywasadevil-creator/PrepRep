<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrepRep</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<nav class="rail" aria-label="Main">
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="var(--leaf)"/><path d="M10 19c0-6 5-10 12-10 0 7-4 12-10 12" fill="#fff"/><path d="M10 23c2-5 5-8 9-10" stroke="var(--leaf)" stroke-width="2" fill="none" stroke-linecap="round"/></svg><b>PrepRep</b></div>
  <button class="nav" data-view="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg><span>Today</span></button>
  <button class="nav" data-view="meals"><svg viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0zM8 3c0 2 2 2 2 4M12 3c0 2 2 2 2 4"/></svg><span>Meal prep</span></button>
  <button class="nav" data-view="groceries"><svg viewBox="0 0 24 24"><path d="M3 4h2l2 11h11l2-8H6"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg><span>Groceries</span></button>
  <button class="nav" data-view="workouts"><svg viewBox="0 0 24 24"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg><span>Workouts</span></button>
  <button class="nav" data-view="schedule"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Schedule</span></button>
  <button class="nav" data-view="progress"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg><span>Progress</span></button>
  <div class="grow"></div>
  <button class="nav" data-view="setup"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><span>You</span></button>
  <div class="brain" id="brain" title="PrepRep's brain is being built by your Local AI, one checked step at a time."><div class="bbar"><i id="brain-bar"></i></div><small id="brain-text">Checking the brain…</small></div>
</nav>
<main id="main" tabindex="-1"></main>
<div class="planbar" id="planbar" hidden><div class="thumbs" id="plan-thumbs"></div><span id="plan-count"></span><button class="primary" id="plan-go">Plan my week</button></div>
<script src="bridge.js"></script>
<script src="toast.js"></script>
<script src="states.js"></script>
<script src="form.js"></script>
<script src="store.js"></script>
<script src="chart.js"></script>
<script src="app.js"></script>
</body>
</html>
