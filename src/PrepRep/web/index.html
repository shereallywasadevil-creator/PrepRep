<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrepRep</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="appbar">
  <button class="iconbtn" id="back" aria-label="Back" hidden><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="logo"><svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13"/><path d="M8 17c0-5 4-9 11-9 0 6-4 10-9 10" fill="#fff"/></svg>preprep</div>
  <div class="kcal" id="kcalchip" hidden><b id="kcal">…</b> kcal today</div>
  <button class="iconbtn" id="search-btn" aria-label="Search recipes"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
</header>
<main id="main" tabindex="-1"></main>
<div class="buildbar" id="buildbar" hidden><div class="thumbs" id="thumbs"></div><button class="build" id="build">Build plan</button></div>
<nav class="tabs" aria-label="Main">
  <button data-tab="plans"><svg viewBox="0 0 24 24"><path d="M7 3v8M5 3v4a2 2 0 0 0 4 0V3M7 11v10M16 3c-2 1-3 4-3 7h3v11"/></svg><span>Meal Plans</span></button>
  <button data-tab="list"><svg viewBox="0 0 24 24"><path d="M3 4h2l2 11h11l2-8H6"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg><span>List</span><i class="dot" id="list-dot" hidden></i></button>
  <button data-tab="train"><svg viewBox="0 0 24 24"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg><span>Workouts</span></button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M4 18l5-5 4 4 7-8"/></svg><span>Progress</span></button>
  <button data-tab="you"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><span>You</span></button>
</nav>
<script src="bridge.js"></script>
<script src="toast.js"></script>
<script src="states.js"></script>
<script src="form.js"></script>
<script src="store.js"></script>
<script src="chart.js"></script>
<script src="wizard.js"></script>
<script src="app.js"></script>
</body>
</html>
