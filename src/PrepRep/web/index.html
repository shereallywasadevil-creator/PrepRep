<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrepRep</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body data-zone="kitchen">
<header class="top">
  <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15"/><path d="M10 19c0-6 5-10 12-10 0 7-4 12-10 12" fill="#fff"/></svg>PrepRep</div>
  <div class="flip" role="group" aria-label="Board">
    <button id="to-kitchen" aria-pressed="true">Kitchen</button><button id="to-gym" aria-pressed="false">Gym</button><i aria-hidden="true"></i>
  </div>
  <div class="right"><div class="target"><small>Eat today</small><b id="kcal">…</b><small id="kcal-note">kcal</small></div>
  <div class="brainchip" title="PrepRep's brain is built by your Local AI, one checked step at a time"><i id="brain-bar"></i><span id="brain-text">Brain…</span></div></div>
</header>
<section class="hero" id="hero" aria-live="polite"></section>
<main class="board" id="board" aria-label="Your week"></main>
<nav class="dock" aria-label="Tools">
  <button data-sheet="pantry"><svg viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0zM8 3c0 2 2 2 2 4M12 3c0 2 2 2 2 4"/></svg><span>Pantry</span></button>
  <button data-sheet="shop"><svg viewBox="0 0 24 24"><path d="M3 4h2l2 11h11l2-8H6"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg><span>Shopping</span></button>
  <button data-sheet="progress"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg><span>Progress</span></button>
  <button data-sheet="you"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><span>You</span></button>
</nav>
<dialog class="sheet" id="sheet" aria-labelledby="sheet-title"><div class="grab" aria-hidden="true"></div><header><h2 id="sheet-title"></h2><button class="x" id="sheet-close" aria-label="Close">×</button></header><div class="sheet-body" id="sheet-body"></div></dialog>
<script src="bridge.js"></script>
<script src="toast.js"></script>
<script src="states.js"></script>
<script src="form.js"></script>
<script src="store.js"></script>
<script src="chart.js"></script>
<script src="app.js"></script>
</body>
</html>
